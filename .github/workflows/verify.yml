name: Verify

# Everything here runs without a GPU, an API key or network access to the model:
# repository checks, then the Python client against a stub server.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repository checks (code compiles, dataset matches stats, versions and links)
        run: python3 scripts/check_repo.py

      - name: Install the Python client
        run: pip install ./packages/python

      - name: Client and CLI against a stub endpoint
        run: |
          python3 - <<'PY'
          import json, os, subprocess, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  assert body["messages"][0]["role"] == "system", "system prompt missing"
                  assert body["chat_template_kwargs"] == {"enable_thinking": False}
                  text = body["messages"][-1]["content"]
                  payload = json.dumps({"choices": [{"message": {"content": "rewritten: " + text}}]}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(payload)))
                  self.end_headers()
                  self.wfile.write(payload)

              def log_message(self, *args):
                  pass

          server = HTTPServer(("127.0.0.1", 8123), Handler)
          threading.Thread(target=server.serve_forever, daemon=True).start()

          from gohumanize_open_humanizer import Humanizer, __version__
          h = Humanizer(base_url="http://127.0.0.1:8123/v1", api_key="test")
          out = h.humanize("It is worth noting that the committee reached a consensus.")
          assert out.startswith("rewritten:"), out
          long_text = ("First paragraph, which is long enough to stand on its own.\n\n"
                       "Second paragraph, also long enough to be sent separately.")
          assert h.humanize_document(long_text).count("rewritten:") == 2
          print("client OK, version", __version__)

          env = dict(os.environ, OPEN_HUMANIZER_API_KEY="test")
          cli = subprocess.run(["open-humanizer", "hello there", "--url", "http://127.0.0.1:8123/v1"],
                               capture_output=True, text=True, env=env)
          assert cli.returncode == 0, cli.stderr
          assert "rewritten: hello there" in cli.stdout, cli.stdout
          print("CLI OK")
          server.shutdown()
          PY
