[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gohumanize-open-humanizer"
version = "0.1.11"
description = "Client and CLI for the GoHumanize Open Humanizer, an open Qwen3-4B fine-tune that rewrites AI-styled text into natural prose"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "GoHumanize team" }]
keywords = ["humanizer", "ai-humanizer", "humanize", "humanize-text", "humanize-ai-text", "text-rewriting", "rewriter", "rewrite", "paraphrase", "paraphraser", "style-transfer", "writing-assistant", "ai-writing", "editing", "prose", "natural-language", "open-model", "open-source-model", "qwen3", "lora", "fine-tune", "llm", "llm-tools", "ai-tools", "ai-assistant", "gohumanize"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://gohumanize.ai/open-model"
Repository = "https://github.com/GoHumanize-ai/gohumanize-open-humanizer"

[project.scripts]
open-humanizer = "gohumanize_open_humanizer:main"

[tool.setuptools.packages.find]
where = ["."]
